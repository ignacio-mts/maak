openapi: 3.0.3
info:
  title: Maak Onboarding API
  version: 0.1.0-draft
  description: |
    DRAFT OpenAPI for Maak ola 2 scaffolding. Not a production contract.
    Paths sketch Fargate API surfaces; implementations may be stubs.
servers:
  - url: https://api.maak.example
    description: Placeholder (ola 2+)
tags:
  - name: Personas
  - name: Cases
  - name: IntakeLinks
  - name: Memberships
  - name: Bindings
  - name: Adapter
paths:
  /v1/cases:openFromTemplate:
    post:
      tags: [Cases]
      summary: Open a compliance case from a case template
      operationId: openCaseFromTemplate
      security:
        - oauth2: [cases:hitl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCaseFromTemplateRequest"
      responses:
        "201":
          description: Case opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/cases/{id}/evaluateAll:
    post:
      tags: [Cases]
      summary: Evaluate all linked rules for a case
      operationId: evaluateAllCaseRules
      security:
        - oauth2: [cases:hitl, rules:publish]
      parameters:
        - $ref: "#/components/parameters/caseId"
      responses:
        "200":
          description: Evaluation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateAllResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/cases/{id}/returnForFix:
    post:
      tags: [Cases]
      summary: Return case to client for gap remediation
      operationId: returnCaseForFix
      security:
        - oauth2: [cases:hitl, cases:pld]
      parameters:
        - $ref: "#/components/parameters/caseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnForFixRequest"
      responses:
        "200":
          description: Case returned for fix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCase"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/intake-links:
    post:
      tags: [IntakeLinks]
      summary: Create a write-only intake link for a case
      operationId: createIntakeLink
      security:
        - oauth2: [cases:hitl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntakeLinkRequest"
      responses:
        "201":
          description: Intake link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeLink"

  /v1/intake-links/{token}/submit:
    post:
      tags: [IntakeLinks]
      summary: Submit gap payload via intake token (client, write-only)
      operationId: submitIntakeLink
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  caseId:
                    type: string
        "410":
          description: Token expired or consumed

  /v1/personas/{id}:
    get:
      tags: [Personas]
      summary: Get persona by id
      operationId: getPersona
      security:
        - oauth2: [persona:read]
      parameters:
        - $ref: "#/components/parameters/personaId"
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/personas/{id}/emitPersonaOK:
    post:
      tags: [Personas]
      summary: Emit PersonaOK (verified) event for downstream adapters
      operationId: emitPersonaOK
      security:
        - oauth2: [cases:pld]
      parameters:
        - $ref: "#/components/parameters/personaId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                caseId:
                  type: string
                correlationId:
                  type: string
      responses:
        "202":
          description: PersonaOK accepted for outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaOK"

  /v1/memberships:
    get:
      tags: [Memberships]
      summary: List memberships
      operationId: listMemberships
      security:
        - oauth2: [persona:read]
      parameters:
        - in: query
          name: parentPersonaId
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
    post:
      tags: [Memberships]
      summary: Create membership
      operationId: createMembership
      security:
        - oauth2: [cc:create]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Membership"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /v1/bindings/face/sessions:
    post:
      tags: [Bindings]
      summary: Create FaceBinding liveness session
      operationId: createFaceSession
      security:
        - oauth2: [cases:hitl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceSession"

  /v1/bindings/face/results:
    post:
      tags: [Bindings]
      summary: Complete FaceBinding session / ingest normalized result
      operationId: completeFaceSession
      security:
        - oauth2: [cases:hitl]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                payload:
                  description: Provider-specific completion payload (opaque to domain)
                  additionalProperties: true
      responses:
        "200":
          description: Normalized liveness result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResult"

  /v1/adapter/sicli/handoff:
    post:
      tags: [Adapter]
      summary: Hand PersonaOK package to Adapter SICLI
      operationId: sicliHandoff
      security:
        - oauth2: [cases:pld]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaOK"
      responses:
        "202":
          description: Handoff acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SicliHandoffAck"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Machine-to-machine client credentials (draft scopes)
      flows:
        clientCredentials:
          tokenUrl: https://auth.maak.example/oauth/token
          scopes:
            cases:hitl: HITL case operations (open, evaluate, intake links, face binding)
            cases:pld: PLD / compliance decisions (return for fix, PersonaOK, SICLI handoff)
            cc:create: Create cost-center / membership relationships
            rules:publish: Publish or trigger rule evaluation
            persona:read: Read persona and membership directory

  parameters:
    caseId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Compliance case id
    personaId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Persona id
    token:
      in: path
      name: token
      required: true
      schema:
        type: string
      description: Intake link token

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    OpenCaseFromTemplateRequest:
      type: object
      required: [templateId, personaId]
      properties:
        templateId:
          type: string
        personaId:
          type: string
        correlationId:
          type: string

    ComplianceCase:
      type: object
      properties:
        id:
          type: string
        personaId:
          type: string
        templateId:
          type: string
        status:
          type: string
          description: Draft lifecycle status (e.g. OPEN, RETURNED, READY, ACTIVATING)
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/CaseGap"

    CaseGap:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        ownership:
          type: string
          enum: [client, reviewer, engine, compliance]

    EvaluateAllResponse:
      type: object
      properties:
        caseId:
          type: string
        passed:
          type: boolean
        evaluations:
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
              result:
                type: string
                enum: [PASS, FAIL, SKIP, ERROR]
              message:
                type: string

    ReturnForFixRequest:
      type: object
      required: [gapIds]
      properties:
        gapIds:
          type: array
          items:
            type: string
        note:
          type: string

    CreateIntakeLinkRequest:
      type: object
      required: [caseId]
      properties:
        caseId:
          type: string
        expiresAt:
          type: string
          format: date-time

    IntakeLink:
      type: object
      properties:
        token:
          type: string
        caseId:
          type: string
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri

    Persona:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [legal_entity, natural_person, cost_center]
        legalName:
          type: string
        rfc:
          type: string
        state:
          type: string
          description: PROSPECTO | EN_KYC | VERIFICADA | BLOQUEADA | EN_REMEDIACION
        parentPersonaId:
          type: string
          nullable: true

    PersonaOK:
      type: object
      required: [personaId]
      properties:
        personaId:
          type: string
        caseId:
          type: string
        correlationId:
          type: string
        emittedAt:
          type: string
          format: date-time
        snapshot:
          type: object
          additionalProperties: true
          description: Opaque alta package for Adapter SICLI

    Membership:
      type: object
      required: [userId, parentPersonaId, role]
      properties:
        id:
          type: string
        userId:
          type: string
        parentPersonaId:
          type: string
        role:
          type: string
          enum: [ops, pld, cc_creator]

    FaceSessionRequest:
      type: object
      required: [personaId, caseId]
      properties:
        personaId:
          type: string
        caseId:
          type: string
        returnUrl:
          type: string
          format: uri

    FaceSession:
      type: object
      properties:
        sessionId:
          type: string
        provider:
          type: string
          description: Adapter id only; not a domain dependency
        clientPayload:
          type: object
          additionalProperties: true

    LivenessResult:
      type: object
      required: [status, evidenceIds]
      properties:
        status:
          type: string
          enum: [PASS, FAIL, ERROR, SKIP]
        score:
          type: number
        vendorRawRef:
          type: string
        evidenceIds:
          type: array
          items:
            type: string

    SicliHandoffAck:
      type: object
      required: [ack, handoffId]
      properties:
        ack:
          type: boolean
        handoffId:
          type: string
